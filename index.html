<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Video IA - Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col items-center justify-center p-4 md:p-8">

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 bg-gray-900 border border-gray-800 p-6 md:p-8 rounded-3xl shadow-2xl">
        
        <!-- Columna Izquierda: Formulario de Control -->
        <div class="flex flex-col justify-between space-y-6">
            <div>
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-3 h-8 bg-indigo-500 rounded-full"></div>
                    <h1 class="text-2xl font-bold text-white tracking-wide">Creador de Video IA</h1>
                </div>

                <form id="generatorForm" class="space-y-5">
                    <!-- Preset de Personaje -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Preset de Personaje</label>
                        <select id="characterPreset" onchange="applyPreset()" class="w-full bg-gray-800 text-gray-200 text-sm p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 transition-all">
                            <option value="custom">Personalizado</option>
                            <option value="futuristic">Sabio Ciberpunk / Futurista</option>
                            <option value="epic">Narrador de Leyendas Épicas</option>
                            <option value="presenter">Presentador Noticias Tech</option>
                        </select>
                    </div>

                    <!-- Descripción Física -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Descripción del Personaje</label>
                        <textarea id="characterDescription" rows="3" required class="w-full bg-gray-800 text-gray-200 text-sm p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 transition-all placeholder-gray-500" placeholder="Ej: Un sabio futurista con gafas holográficas doradas y chaqueta azul..."></textarea>
                    </div>

                    <!-- Guion / Narración -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Guion de Narración (Prompt)</label>
                        <textarea id="textPrompt" rows="4" required class="w-full bg-gray-800 text-gray-200 text-sm p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 transition-all placeholder-gray-500" placeholder="Escribe la historia o mensaje que hablará el personaje..."></textarea>
                    </div>

                    <button type="submit" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
                        <span>Generar Video</span>
                    </button>
                </form>
            </div>

            <!-- Estado / Carga -->
            <div id="statusBox" class="hidden p-4 bg-gray-800/60 border border-indigo-500/30 rounded-xl text-center">
                <div class="flex items-center justify-center space-x-2 text-indigo-400 mb-1">
                    <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="statusText" class="text-sm font-medium">Procesando petición...</span>
                </div>
                <p class="text-xs text-gray-400">Generando arte DALL-E 3, audio sintetizado y renderizado MP4.</p>
            </div>
        </div>

        <!-- Columna Derecha: Vista Previa y Reproductor -->
        <div class="flex flex-col justify-center items-center bg-gray-950 border border-gray-800 rounded-2xl p-6 min-h-[380px]">
            <div id="placeholderView" class="text-center text-gray-500 space-y-3">
                <div class="w-16 h-16 mx-auto bg-gray-900 border border-gray-800 rounded-full flex items-center justify-center text-gray-600">
                    🎬
                </div>
                <p class="text-sm">El video generado aparecerá aquí listo para reproducir o descargar.</p>
            </div>

            <div id="videoContainer" class="hidden w-full space-y-4">
                <video id="videoPlayer" controls class="w-full rounded-xl border border-gray-800 shadow-lg bg-black"></video>
                <a id="downloadBtn" download="video_generado.mp4" class="block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/20">
                    Descargar Video MP4
                </a>
            </div>
        </div>

    </main>

    <script>
        const presets = {
            futuristic: "Un joven sabio futurista con gafas holográficas doradas, chaqueta cibernética azul oscuro, cabello corto castaño, expresión serena y estilizada, iluminación de estudio suave.",
            epic: "Un anciano narrador de leyendas con túnica encapuchada, barba canosa larga, sosteniendo un báculo luminoso en un entorno místico, arte fantástico cinematográfico.",
            presenter: "Una joven presentadora de noticias tecnológicas, traje formal profesional, fondo de estudio de televisión inteligente con gráficos holográficos hiperrealistas."
        };

        function applyPreset() {
            const select = document.getElementById('characterPreset');
            const desc = document.getElementById('characterDescription');
            if (presets[select.value]) {
                desc.value = presets[select.value];
            }
        }

        document.getElementById('generatorForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const generateBtn = document.getElementById('generateBtn');
            const statusBox = document.getElementById('statusBox');
            const placeholderView = document.getElementById('placeholderView');
            const videoContainer = document.getElementById('videoContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const downloadBtn = document.getElementById('downloadBtn');

            const characterDescription = document.getElementById('characterDescription').value;
            const textPrompt = document.getElementById('textPrompt').value;

            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusBox.classList.remove('hidden');

            try {
                const response = await fetch('/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ characterDescription, textPrompt })
                });

                if (!response.ok) throw new Error('Error en el servidor al generar el video');

                const blob = await response.blob();
                const videoUrl = URL.createObjectURL(blob);

                videoPlayer.src = videoUrl;
                downloadBtn.href = videoUrl;

                placeholderView.classList.add('hidden');
                videoContainer.classList.remove('hidden');
                videoPlayer.play();

            } catch (error) {
                alert('Ocurrió un error al procesar el video. Verifica las claves API en el servidor Node.js.');
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                statusBox.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
